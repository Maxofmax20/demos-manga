name: CI
on:
  push:
    branches:
      # - develop
      - master
    paths:
      - '**'
      - '!**.md'
  # pull_request:
  #   paths-ignore:
  #     - '**.md'
  # Dispatch or Manual triggers
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build app
    runs-on: 'ubuntu-24.04'
    # This public fork can validate and build without owner-private Google keys.
    # Telemetry is optional and stays disabled unless BOTH inputs are provided.
    env:
      MANGA_TELEMETRY_CONFIGURED: ${{ secrets.GOOGLE_SERVICES_JSON != '' && secrets.GOOGLE_CLIENT_SECRETS_JSON != '' }}
      MANGA_SIGNING_CONFIGURED: ${{ secrets.SIGNING_KEY != '' && secrets.ALIAS != '' && secrets.KEY_STORE_PASSWORD != '' && secrets.KEY_PASSWORD != '' }}

    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Write google-services.json
        if: env.MANGA_TELEMETRY_CONFIGURED == 'true'
        uses: DamianReeves/write-file-action@6929a9a6d1807689191dcc8bbe62b54d70a32b42 # v1.3
        with:
          path: app/google-services.json
          contents: ${{ secrets.GOOGLE_SERVICES_JSON }}
          write-mode: overwrite

      - name: Write client_secrets.json
        if: env.MANGA_TELEMETRY_CONFIGURED == 'true'
        uses: DamianReeves/write-file-action@6929a9a6d1807689191dcc8bbe62b54d70a32b42 # v1.3
        with:
          path: app/src/main/assets/client_secrets.json
          contents: ${{ secrets.GOOGLE_CLIENT_SECRETS_JSON }}
          write-mode: overwrite

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Check code format
        run: ./gradlew spotlessCheck

      - name: Build app
        run: |
          if [ "$MANGA_TELEMETRY_CONFIGURED" = "true" ]; then
            ./gradlew assemblePreview -Pinclude-telemetry -Penable-updater
          else
            echo "Building without optional Firebase/Google telemetry configuration"
            ./gradlew assemblePreview -Penable-updater
          fi

      # KMK --> Owner manually dispatches CI to receive an unsigned release
      # APK that can be signed with the existing protected VPS release key.
      # This never publishes or installs an unsigned APK.
      - name: Build unsigned owner release for signing
        if: github.event_name == 'workflow_dispatch'
        run: ./gradlew assembleRelease -Pdisable-code-shrink -Penable-updater

      - name: Upload owner release for protected signing
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DemosManga-unsigned-release-APK
          path: app/build/outputs/apk/release/*unsigned*.apk
          if-no-files-found: error
      # KMK <--

      - name: Run unit tests
        id: unit_tests
        run: ./gradlew testReleaseUnitTest

      - name: Verify SQLDelight migrations
        run: ./gradlew verifySqlDelightMigration

      - name: Upload test report
        if: steps.unit_tests.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-report-${{ github.sha }}
          path: app/build/reports/tests/testReleaseUnitTest

      - name: Sign APK
        if: env.MANGA_SIGNING_CONFIGURED == 'true'
        uses: r0adkll/sign-android-release@f30bdd30588842ac76044ecdbd4b6d0e3e813478
        with:
          releaseDirectory: app/build/outputs/apk/preview
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: '35.0.1'

      - name: Rename apk
        if: env.MANGA_SIGNING_CONFIGURED == 'true'
        id: current_commit
        run: |
          set -e
          version_tag=$(echo ${GITHUB_REF/refs\/heads\//} | sed -r 's/^refs\/(heads|tags)\///' | sed -r 's/[-\/]+/_/g')
          commit_count=$(git rev-list --count HEAD)
          echo "VERSION_TAG=$version_tag"
          echo "VERSION_TAG=$version_tag" >> $GITHUB_OUTPUT
          echo "COMMIT_COUNT=$commit_count"
          echo "COMMIT_COUNT=$commit_count" >> $GITHUB_OUTPUT
          mv app/build/outputs/apk/preview/app-universal-preview-signed.apk Komikku-$version_tag-r$commit_count.apk

      - name: Upload APK
        if: env.MANGA_SIGNING_CONFIGURED == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Komikku-${{ steps.current_commit.outputs.VERSION_TAG }}-r${{ steps.current_commit.outputs.COMMIT_COUNT }}.apk
          path: ./*.apk

      # Unsigned artifacts are for CI/QA only, never an installable release.
      - name: Upload unsigned preview for verification
        if: env.MANGA_SIGNING_CONFIGURED != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: UNSIGNED-NOT-FOR-INSTALL-${{ github.sha }}
          path: app/build/outputs/apk/preview/*unsigned*.apk
          if-no-files-found: ignore

      - name: Upload mapping
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mapping-${{ github.sha }}
          path: app/build/outputs/mapping/preview
