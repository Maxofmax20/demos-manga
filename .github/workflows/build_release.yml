name: Demos Manga release build
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-unsigned:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check formatting
        run: ./gradlew spotlessCheck
      - name: Build release APKs
        run: ./gradlew assembleRelease -Penable-updater
      - name: Run unit tests
        run: ./gradlew testReleaseUnitTest
      - name: Store unsigned release APKs for trusted VPS signing
        uses: actions/upload-artifact@v4
        with:
          name: DemosManga-unsigned-APK
          path: app/build/outputs/apk/release/*unsigned.apk
          if-no-files-found: error
          retention-days: 7
